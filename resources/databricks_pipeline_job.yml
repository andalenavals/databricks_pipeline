resources:
  jobs:
    daily_summary_job:
      name: "[${bundle.environment}] databricks_pipeline_daily_summary"
      description: "Build a simple per-customer order summary from CSV input."
      tags:
        project: databricks_pipeline
        owner: andres
      tasks:
        - task_key: daily_summary
          spark_python_task:
            python_file: ../src/databricks_pipeline/tasks/daily_summary.py
            parameters:
              - --input-path
              - dbfs:/FileStore/databricks_pipeline/sample_orders.csv
              - --output-path
              - /Volumes/${bundle.environment}/default/outputs/daily_summary
              #- dbfs:/FileStore/databricks_pipeline/outputs/daily_summary
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies: 
              - ../dist/*.whl

