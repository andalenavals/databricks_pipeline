bundle:
  name: databricks_pipeline

artifacts:
  default:
    type: whl
    path: .
    build: python -m build --wheel

include:
  - resources/databricks_pipeline_serverless_job.yml
  # - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
